<div class="panel"><h2>{{ code }}: {{ title }}</h2><p class="muted">{{ text }}</p>
  <a class="btn btn-ghost" href="{{ url_for('main.index') }}">Go to the home page</a></div>

{% block content %}

{% endblock %}
